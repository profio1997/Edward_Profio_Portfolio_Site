headline: "Building Veritas, a learning app that checks what you remember"
lede: >-
  Veritas reads any book or document to you in your own voice, quizzes you at the end of each chapter, and brings back what you
  got wrong until it sticks. I started it and do the product work myself, including the research, the design, the AI decisions and the launch
  plan. It isn't released yet, so this case study covers the thinking and decisions so far. There are no results yet.
