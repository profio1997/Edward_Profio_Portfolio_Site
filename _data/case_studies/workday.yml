headline: "Workday Accessibility AI Strategy"
lede: >-
  Workday's accessibility team wanted to know where AI could make the product work better for people with disabilities, and which
  companies to build that with. I worked on it for 12 months as an intern, as part of a
  four-person Carnegie Mellon Tepper capstone team. I led the research into the solutions, and I wrote the rollout plan, the roadmap
  and the AI development practices that came out of it.
