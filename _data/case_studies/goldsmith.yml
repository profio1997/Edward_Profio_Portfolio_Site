kicker: "Goldsmith"
headline: "Goldsmith: AI design plus a marketplace for custom jewelry"
lede: >-
  Goldsmith lets a buyer describe a piece of jewelry in plain words, see it in 3D, and compare quotes from manufacturers. I started it as a
  Carnegie Mellon Lean Entrepreneurship course project and owned the product, the research plan, the business model and the financial model behind
  an investor pitch in December 2024, then took it from concept to launch in 12 weeks. This page shows the thinking, the plan and what I would test next.
  I have not published usage or revenue numbers here, and the plan figures below are targets, not results.
