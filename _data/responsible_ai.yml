# Home-page "How I build AI responsibly": three habits, each with one real example.
intro: "Most of my AI work has been in healthcare, where a wrong answer costs something and the rules are specific. These are the three habits I hold every AI and agentic product to."
items:
  - h: "I design the guardrails with the feature"
    t: "In a hospital, an AI feature can't ship first and get made safe later, so I put the controls on the same ticket as the feature. An agent that touches patient data gets only the minimum it needs, runs under its own identity, and leaves an audit trail of every tool call. It can read freely, but anything that writes to the chart waits for a clinician to approve it."
    frameworks: ["HIPAA Privacy and Security Rules", "FDA clinical decision support guidance"]
    proof:
      - "Aurifex Healthcare: decided where AI, forecasting and automation add real value in discharge and placement workflows, and put guardrails around each."
      - "UW Health: integrated GenAI agents with Epic, Best Buy Health remote patient monitoring and UiPath, with regulatory compliance and guardrails built into each integration."
  - h: "I treat evaluation as part of the product"
    t: "I judge an AI system the way I would a clinician's workflow, which means looking past whether the answer was right. For an agent, I check whether it picked the right tool, used the right data, stopped and escalated when it should, and avoided claims it couldn't support. I test for prompt injection and data leakage before launch and keep monitoring after it."
    frameworks: ["NIST AI RMF and GenAI Profile", "ONC HTI-1 transparency"]
    proof:
      - "Aurifex Healthcare: built an AI software development lifecycle and operating model, using AI agents and automation, that cut release cycle time by 60% and code release errors by 40%."
      - "UW Health: built a real-time Databricks pipeline combining usage telemetry with clinician feedback, cutting iteration cycles from months to days and feeding prompt, retrieval and UX fixes."
  - h: "I measure what changes for people"
    t: "Engagement only tells you people opened the product, not whether it helped them, or helped everyone. Before launch I pick the outcome that matters to patients, clinicians and the business, name who owns the model afterward, and check performance across patient groups. That last check is partly a legal one, since the nondiscrimination rule under Section 1557 of the ACA now covers the decision support tools used in patient care."
    frameworks: ["ACA Section 1557 (45 CFR 92.210)", "ISO/IEC 42001"]
    proof:
      - "Aurifex Healthcare: the two-clinic pilot was judged on patient flow: 20% fewer excess patient days and 15% higher acceptance into acute rehabilitation, worth over $2 million a year."
      - "UW Health: over 90% engagement, and more than 42,000 clinician hours saved in the first year, from automating work that took up to 40% of a nursing shift."
